{% extends "base.html" %}
{% block title %}New supplier{% endblock %}
{% block content %}
<h1>New supplier</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form action="/suppliers" method="post">
  <p><label>Name <input name="name" value="{{ form.name }}"></label></p>
  <p><label>Email <input name="email" value="{{ form.email }}"></label></p>
  <p><label>Phone <input name="phone" value="{{ form.phone }}"></label></p>
  <p><label>Fax number <input name="fax" value="{{ form.fax }}"></label></p>
  <button>Save supplier</button>
</form>
{% endblock %}
